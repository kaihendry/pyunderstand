[project]
name = "pyunderstand"
version = "0.1.10"
description = "Document a dependency"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kai Hendry", email = "hendry@iki.fi" }
]

dependencies = []
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "0.1.10"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
